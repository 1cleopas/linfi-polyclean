services:
  - type: web
    name: linfi-polyclean-live
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      # Free Postgres connection string (for example from Neon). Without it, data is wiped on every restart.
      - key: DATABASE_URL
        sync: false
